agents:
  directory: agents
models:
  directory: models
  # Agent 未指定 model 时使用的模型，格式为 provider_id/model_id；省略时按 Provider id、模型 id 排序后取第一个，也可通过 OPENVAALA_MODELS_DEFAULT_MODEL 设置。
  # default_model: local/default
skills:
  directory: skills
executors:
  directory: executors
mcp_servers:
  directory: mcp_servers
run:
  agent_name: default
# max_image_kb 是 read_file 返回给模型的单张图片大小上限，单位 KB，默认 500，必须大于 0；超出时压缩图片。
# tools:
#   max_image_kb: 500
# 遥测：日志默认写 ~/.local/state/openvaala/openvaala.log；配置 otlp_endpoint 后经 OTLP HTTP 导出 trace、指标与日志。
# capture_content 默认开启，trace 会记录对话内容、工具参数和结果；设为 false 后不记录这些内容。日志和指标不包含对话内容。
# telemetry:
#   log_level: info
#   log_file: ""
#   otlp_endpoint: http://127.0.0.1:4318
#   capture_content: true
#   otlp_headers:
#     Authorization: Bearer <token>
# listen 是 serve 的监听地址；token 为空时先复用连接文件中的令牌，两者均为空时由 serve 自动生成。
# workspace_directory 是新对话没指定目录时 local Executor 用的目录，为空时用 serve 的启动目录，支持 ~/ 开头，必须是绝对路径。
# server:
#   listen: 127.0.0.1:8790
#   workspace_directory: ~/code
# TUI、acp、app-server 和 codex 默认连接本机 serve；设置 url 或 OPENVAALA_CLIENT_URL 后连接指定的 serve。
# token 是连接远端 serve 的令牌，url 自带 ?token= 时以 url 为准。
# path_mappings 把客户端路径换成对应的 serve 路径，按完整目录名匹配，多条命中时取最长的一条。
# client 可以是 Windows 路径（盘符开头，\ 和 / 等价），server 必须是 serve 上的绝对路径；同一个 client 或 server 不能出现在两条映射里。
# client:
#   url: ws://10.0.0.5:8790/api/v1/openvaala
#   token: <serve 的 token>
#   path_mappings:
#     - client: /Users/me/code
#       server: /srv/code
#     - client: 'C:\Users\me\code'
#       server: /mnt/c/Users/me/code
